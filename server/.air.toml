#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/mini-app ."
  entrypoint = ["./tmp/mini-app"]
  delay = 500
  exclude_dir = ["tmp", "vendor", "doc"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "toml", "json"]
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
