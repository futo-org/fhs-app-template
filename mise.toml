[tools]
node = "26.13.1"
pnpm = "12.21.0"
go = "1.27.4"
air = "1.67.4"
"go:github.com/pressly/goose/v3/cmd/goose" = "3.30.1"
atlas = "1.3.0"
golangci-lint = "2.15.0"

[tasks."check"]
description = "Run the same checks as CI"
depends = ["server:lint", "test", "build", "open-api:check", "db:check", "web:check"]

[tasks."dev"]
dir = "docker"
run = "docker compose -f docker-compose.dev.yml up --build"

[tasks."dev-down"]
dir = "docker"
run = "docker compose -f docker-compose.dev.yml down"

[tasks."prod"]
dir = "docker"
run = "docker compose -f docker-compose.prod.yml up --build"

[tasks."prod-build"]
description = "Build the production docker image and print its embedded version"
dir = "docker"
run = [
  "docker compose -f docker-compose.prod.yml build",
  "echo \"built mini-app:latest, version: $(docker run --rm mini-app:latest --version)\"",
]

[tasks."prod-down"]
dir = "docker"
run = "docker compose -f docker-compose.prod.yml down"

[tasks."dev-update"]
dir = "docker"
run = "docker compose -f docker-compose.dev.yml up -d --build"

[tasks."build"]
description = "Build the server binary (same flags as the Dockerfile) and print the embedded version"
dir = "server"
run = [
  "CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/mini-app .",
  "echo \"built bin/mini-app, version: $(./bin/mini-app --version)\"",
]

[tasks."test"]
description = "Run all Go tests with the race detector"
dir = "server"
run = "go run -mod=readonly github.com/onsi/ginkgo/v2/ginkgo -p -race ./..."

[tasks."server:format"]
description = "Format Go sources with gofmt"
dir = "server"
run = "gofmt -w ."

[tasks."server:lint"]
description = "Run golangci-lint"
dir = "server"
run = "golangci-lint run"

[tasks."web:check"]
description = "Install from the lockfile, check Svelte types and build the SPA"
dir = "web"
run = ["pnpm install --frozen-lockfile", "pnpm check", "pnpm build"]

[tasks."open-api"]
description = "Export the OpenAPI spec from the Go routes"
dir = "server"
shell = "bash -c"
run = '''
set -euo pipefail
spec=$(go run . -open-api)
printf '%s\n' "$spec" > doc/openapi.json
'''

[tasks."open-api:check"]
description = "Check that the committed OpenAPI spec matches the Go routes"
dir = "server"
shell = "bash -c"
run = '''
set -euo pipefail
spec=$(go run . -open-api)
if ! diff -u doc/openapi.json <(printf '%s\n' "$spec"); then
  printf 'Run mise run open-api and commit server/doc/openapi.json.\n' >&2
  exit 1
fi
'''

[tasks.create-migration]
dir = "server"
usage = 'arg "name"'
run = 'goose -dir internal/database/migrations create "$usage_name" sql'

[tasks."db:diff"]
dir = "server"
run = "atlas migrate diff --env bun"

[tasks."db:lint"]
dir = "server"
run = "atlas migrate lint --env bun --latest 1"

[tasks."db:hash"]
dir = "server"
run = "atlas migrate hash --env bun"

[tasks."db:check"]
description = "Check migration checksums and compare migrations with Bun entities"
dir = "server"
shell = "bash -c"
run = '''
set -euo pipefail
scratch=$(mktemp -d)
trap 'rm -rf "$scratch"' EXIT
cp -R internal/database/migrations "$scratch/"
atlas migrate diff --env bun --dir "file://$scratch/migrations?format=goose" drift_check
if ! diff -qr internal/database/migrations "$scratch/migrations"; then
  printf 'Run mise run db:diff <name> and commit the migration and atlas.sum.\n' >&2
  exit 1
fi
'''
