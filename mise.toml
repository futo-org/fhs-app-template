[tools]
node = "25.9.0"
pnpm = "11.26.0"
go = "1.27.1"
air = "1.67.4"
"go:github.com/pressly/goose/v3/cmd/goose" = "3.27.3"
"go:github.com/onsi/ginkgo/v2/ginkgo" = "2.32.1"
atlas = "1.3.0"

[tasks."dev"]
dir = "docker"
run = "docker compose -f docker-compose.dev.yml up --build"

[tasks."dev-down"]
dir = "docker"
run = "docker compose -f docker-compose.dev.yml down"

[tasks."prod"]
dir = "docker"
run = "docker compose -f docker-compose.prod.yml up --build"

[tasks."prod-build"]
description = "Build the production docker image and print its embedded version"
dir = "docker"
run = [
  "docker compose -f docker-compose.prod.yml build",
  "echo \"built mini-app:latest, version: $(docker run --rm mini-app:latest --version)\"",
]

[tasks."prod-down"]
dir = "docker"
run = "docker compose -f docker-compose.prod.yml down"

[tasks."dev-update"]
dir = "docker"
run = "docker compose -f docker-compose.dev.yml up -d --build"

[tasks."build"]
description = "Build the server binary (same flags as the Dockerfile) and print the embedded version"
dir = "server"
run = [
  "CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/mini-app .",
  "echo \"built bin/mini-app, version: $(./bin/mini-app --version)\"",
]

[tasks."test"]
dir = "server"
run = "ginkgo -p ./test/..."

[tasks.create-migration]
dir = "server"
usage = 'arg "name"'
run = "goose create $usage_name sql"

[tasks."db:diff"]
dir = "server"
run = "atlas migrate diff --env bun"

[tasks."db:lint"]
dir = "server"
run = "atlas migrate lint --env bun --latest 1"
