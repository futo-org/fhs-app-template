# Deploy Docker Compose — attached to each GitHub Release as an artifact.
# Pulls the prebuilt image from GHCR (no local build); the release workflow
# pins the image tag to the released version before attaching this file.
# Usage: docker compose up -d

name: mini-app

services:
  mini_app:
    container_name: mini_app
    image: ghcr.io/futo-org/fhs-app-template:latest
    volumes:
      - ./appdata:/app/appdata
    ports:
      - 3001:3001
    restart: always
